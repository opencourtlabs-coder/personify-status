<title>Personify Status</title>
<style>
  :root {
    --background: 165 20% 98%;
    --foreground: 165 40% 15%;
    --border: 165 15% 90%;
    --card: 0 0% 100%;
    --primary: 175 40% 35%;
    --primary-foreground: 0 0% 100%;
    --muted: 165 15% 90%;
    --muted-foreground: 165 20% 45%;
    --destructive: 0 60% 50%;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: 5rem;
  }
  .header {
    position: sticky; top: 0; z-index: 10;
    background: hsl(var(--background) / 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid hsl(var(--border) / 0.5);
  }
  .header-inner {
    max-width: 64rem; margin: 0 auto; padding: 0 1.5rem; height: 4rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  }
  .brand { display: flex; align-items: center; gap: 0.75rem; }
  .brand .logo {
    width: 2rem; height: 2rem; border-radius: var(--radius);
    background: hsl(var(--primary) / 0.18);
    display: flex; align-items: center; justify-content: center;
    color: hsl(var(--primary)); font-size: 1rem;
  }
  .brand h1 { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .toggle {
    background: hsl(var(--card)); border: 1px solid hsl(var(--border) / 0.5);
    border-radius: var(--radius); padding: 0.25rem; display: flex; gap: 0.125rem;
  }
  .toggle button {
    border: 0; background: transparent; cursor: pointer;
    padding: 0.375rem 0.75rem; font-size: 0.75rem; font-weight: 500;
    border-radius: calc(var(--radius) - 2px);
    color: hsl(var(--muted-foreground)); transition: all 0.15s;
  }
  .toggle button.active {
    background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
    box-shadow: 0 1px 2px hsl(var(--border) / 0.4);
  }
  main { max-width: 64rem; margin: 0 auto; padding: 2rem 1.5rem; }
  section { margin-bottom: 3rem; }
  .section-title {
    font-size: 0.75rem; font-weight: 500; color: hsl(var(--muted-foreground));
    text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 1rem;
  }
  .card {
    background: hsl(var(--card)); border: 1px solid hsl(var(--border) / 0.5);
    border-radius: 1rem; box-shadow: 0 1px 2px hsl(var(--border) / 0.3);
  }
  .goal {
    padding: 1.5rem 2rem; display: flex; flex-wrap: wrap; align-items: center; gap: 2rem;
  }
  .goal .value { flex: 1; min-width: 12rem; }
  .goal .number { font-size: 2.25rem; font-weight: 300; letter-spacing: -0.02em; }
  .goal .number .sub { color: hsl(var(--muted-foreground)); font-size: 1.25rem; margin-left: 0.5rem; }
  .goal .label { color: hsl(var(--muted-foreground)); font-weight: 500; margin-top: 0.25rem; }
  .bar { width: 100%; max-width: 16rem; height: 1rem; background: hsl(var(--muted) / 0.6);
    border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; background: hsl(var(--primary)); border-radius: 999px;
    transition: width 0.8s ease; }
  .goal-empty { padding: 2rem; text-align: center; color: hsl(var(--muted-foreground)); font-weight: 500; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
  .stat { background: hsl(var(--card)); border: 1px solid hsl(var(--border) / 0.5);
    border-radius: 1rem; padding: 1.5rem; box-shadow: 0 1px 2px hsl(var(--border) / 0.3); }
  .stat .k { font-size: 0.875rem; font-weight: 500; color: hsl(var(--muted-foreground)); }
  .stat .v { font-size: 1.875rem; font-weight: 300; letter-spacing: -0.02em; margin-top: 1rem; }
  .stat .v.primary { color: hsl(var(--primary)); }
  .stat .v.bad { color: hsl(var(--destructive)); }
  .trend { padding: 1.25rem; overflow: hidden; }
  .trend-head { display: flex; align-items: end; justify-content: space-between; gap: 1rem;
    margin-bottom: 1rem; }
  .trend-head p { margin: 0.25rem 0 0; color: hsl(var(--muted-foreground)); font-size: 0.875rem; }
  .trend-total { color: hsl(var(--muted-foreground)); font-size: 0.875rem; white-space: nowrap; }
  .trend-total strong { color: hsl(var(--primary)); font-size: 1.125rem; font-weight: 500; }
  .trend svg { width: 100%; height: auto; display: block; }
  .trend-grid { stroke: hsl(var(--border)); stroke-width: 1; }
  .trend-actual { fill: none; stroke: hsl(var(--primary)); stroke-width: 3; }
  .trend-pace { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 2;
    stroke-dasharray: 6 5; }
  .trend-target { stroke: hsl(var(--muted-foreground)); stroke-width: 1.5; stroke-dasharray: 4 5; }
  .trend-label { fill: hsl(var(--muted-foreground)); font: 12px ui-sans-serif, system-ui, sans-serif; }
  .trend-legend { display: flex; flex-wrap: wrap; gap: 1.25rem; padding: 0.5rem 0.5rem 0;
    color: hsl(var(--muted-foreground)); font-size: 0.75rem; }
  .legend-line { display: inline-block; width: 1.5rem; margin-right: 0.4rem;
    border-top: 2px solid hsl(var(--primary)); vertical-align: middle; }
  .legend-line.pace { border-top-color: hsl(var(--muted-foreground)); border-top-style: dashed; }
  .history-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .history-head .range-start { font-size: 0.875rem; color: hsl(var(--muted-foreground));
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: right; font-size: 0.75rem; font-weight: 500; color: hsl(var(--muted-foreground));
    text-transform: uppercase; letter-spacing: 0.08em; padding: 1rem;
    border-bottom: 1px solid hsl(var(--border) / 0.5);
  }
  thead th:first-child { text-align: left; }
  thead th:last-child { text-align: center; }
  tbody td { padding: 1rem; font-size: 0.875rem; text-align: right;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    border-bottom: 1px solid hsl(var(--border) / 0.25); }
  tbody td:first-child { text-align: left; }
  tbody td.points { color: hsl(var(--primary)); }
  tbody td.done { color: hsl(var(--primary)); }
  tbody td.skip { color: hsl(var(--muted-foreground)); }
  tbody td.fail { color: hsl(var(--destructive)); }
  tbody td.status { text-align: center; }
  .dot { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 999px; }
  .dot.ok { background: hsl(var(--primary)); }
  .dot.no { background: hsl(var(--destructive)); }
  .empty { padding: 3rem; text-align: center; color: hsl(var(--muted-foreground)); font-weight: 500; }
  .footer { max-width: 64rem; margin: 0 auto; padding: 0 1.5rem;
    font-size: 0.75rem; color: hsl(var(--muted-foreground)); }
  @media (min-width: 768px) { .stats { grid-template-columns: repeat(5, 1fr); } }
  @media (max-width: 640px) {
    .trend-head { align-items: start; flex-direction: column; }
    .table-wrap { overflow-x: auto; }
    table { min-width: 46rem; }
  }
</style>

    const x = function (i) {
      return left + (days.length === 1 ? plotWidth / 2 : (i / (days.length - 1)) * plotWidth);
    };
    const y = function (value) { return top + plotHeight - (Number(value) / maxValue) * plotHeight; };
    const path = function (key) {
      return days.map(function (d, i) {
        const value = d[key];
        return value == null ? "" : (i === 0 ? "M" : "L") + x(i).toFixed(1) + " " + y(value).toFixed(1);
      }).join(" ");
    };
    const midValue = Math.round(maxValue / 2);
    let targetLine = "";
    if (target != null) {
      const targetY = y(target).toFixed(1);
      targetLine = '<line class="trend-target" x1="' + left + '" y1="' + targetY +
        '" x2="' + (width - right) + '" y2="' + targetY + '"></line>' +
        '<text class="trend-label" x="' + (width - right - 4) + '" y="' +
        (Number(targetY) - 7) + '" text-anchor="end">Goal ' + num(target) + '</text>';
    }

    return '<div class="card trend">' +
      '<div class="trend-head"><div><h2 class="section-title" style="margin:0">Points Progress</h2>' +
      '<p>Actual quarter-to-date points compared with the pace needed for the goal.</p></div>' +
      '<div class="trend-total"><strong>+' + num(s.totals.pointsEarned) + '</strong> in this range</div></div>' +
      '<svg viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Quarterly points trend">' +
      '<line class="trend-grid" x1="' + left + '" y1="' + top + '" x2="' + left + '" y2="' + (height - bottom) + '"></line>' +
      '<line class="trend-grid" x1="' + left + '" y1="' + y(midValue) + '" x2="' + (width - right) + '" y2="' + y(midValue) + '"></line>' +
      '<line class="trend-grid" x1="' + left + '" y1="' + (height - bottom) + '" x2="' + (width - right) + '" y2="' + (height - bottom) + '"></line>' +
      '<text class="trend-label" x="' + (left - 10) + '" y="' + (top + 4) + '" text-anchor="end">' + num(maxValue) + '</text>' +
      '<text class="trend-label" x="' + (left - 10) + '" y="' + (y(midValue) + 4) + '" text-anchor="end">' + num(midValue) + '</text>' +
      '<text class="trend-label" x="' + (left - 10) + '" y="' + (height - bottom + 4) + '" text-anchor="end">0</text>' +
      targetLine +
      '<path class="trend-pace" d="' + path("onPacePoints") + '"></path>' +
      '<path class="trend-actual" d="' + path("cumulativePoints") + '"></path>' +
      '<text class="trend-label" x="' + left + '" y="' + (height - 10) + '">' + fmtDate(days[0].date) + '</text>' +
      '<text class="trend-label" x="' + (width - right) + '" y="' + (height - 10) + '" text-anchor="end">' + fmtDate(days[days.length - 1].date) + '</text>' +
      '</svg><div class="trend-legend"><span><i class="legend-line"></i>Actual points</span>' +
      '<span><i class="legend-line pace"></i>On-pace line</span></div></div>';
  }

  function renderHistory(s) {
    if (!s.days.length) {
      return '<div class="card empty">No bot runs recorded in this timeframe.</div>';
    }
    let rows = "";
    for (const d of s.days) {
      rows += '<tr>' +
        '<td>' + fmtDate(d.date) + '</td>' +
        '<td>' + d.runs + '</td>' +
        '<td class="points">' + (d.pointsEarned > 0 ? "+" + num(d.pointsEarned) : "-") + '</td>' +
        '<td class="done">' + (d.done > 0 ? d.done : "-") + '</td>' +
        '<td class="skip">' + (d.skipped > 0 ? d.skipped : "-") + '</td>' +
        '<td class="fail">' + (d.failed > 0 ? d.failed : "-") + '</td>' +
        '<td class="status"><span class="dot ' + (d.ok ? "ok" : "no") + '"></span></td>' +
      '</tr>';
    }
    return '<div class="card table-wrap">' +
      '<table><thead><tr><th>Date</th><th>Runs</th><th>Points</th><th>Done</th><th>Skip</th><th>Fail</th>' +
      '<th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function render() {
    const s = DATA[current];
    document.getElementById("app").innerHTML =
      '<section><h2 class="section-title">Quarterly Goal</h2>' + renderGoal(s.goal) + '</section>' +
      '<section>' + renderTrend(s) + '</section>' +
      '<section>' + renderStats(s.totals) + '</section>' +
      '<section><div class="history-head"><h2 class="section-title">Run History</h2>' +
        '<span class="range-start">' + esc(s.rangeStart) + ' to Now</span></div>' +
        renderHistory(s) + '</section>';
    for (const b of document.querySelectorAll("#toggle button")) {
      b.classList.toggle("active", b.dataset.range === current);
    }
  }

  function buildToggle() {
    const wrap = document.getElementById("toggle");
    for (const r of RANGES) {
      const b = document.createElement("button");
      b.textContent = r.label;
      b.dataset.range = r.value;
      b.addEventListener("click", function () { current = r.value; render(); });
      wrap.appendChild(b);
    }
  }

  buildToggle();
  render();
</script>
</body>
</html>
